name: Build & Release Needle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run NeedleCoreTests
        run: swift run NeedleCoreTests

      - name: Build Needle.app
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent build/Needle.app build/Needle-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Needle-macOS
          path: build/Needle-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test & Build Needle.scr
        shell: pwsh
        run: ./windows/build-windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Needle-Windows
          path: windows/dist/Needle.scr

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/Needle-macOS/Needle-macOS.zip
            release-assets/Needle-Windows/Needle.scr
